<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="720" viewBox="0 0 1000 720" role="img" aria-label="Despiece orientativo de Parker">
  <rect width="1000" height="720" fill="#fbfaf5"/>
  <text x="500" y="42" font-family="Arial, sans-serif" font-size="26" font-weight="700" text-anchor="middle" fill="#17202a">Parker · despiece orientatiu</text>
  <text x="500" y="68" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#4a5563">Prototip de sobretaula · sense PCB intermediària · caixa parcial</text>

  <!-- Exploded guide -->
  <line x1="500" y1="110" x2="500" y2="590" stroke="#aab7c4" stroke-width="2" stroke-dasharray="7 7"/>

  <!-- 1 display -->
  <rect x="390" y="95" width="220" height="118" rx="14" fill="#ffffff" stroke="#17202a" stroke-width="2"/>
  <circle cx="500" cy="145" r="34" fill="#dcebf7" stroke="#3c7fb1" stroke-width="2"/>
  <circle cx="490" cy="139" r="3" fill="#17202a"/><circle cx="510" cy="139" r="3" fill="#17202a"/>
  <path d="M489 152 Q500 160 511 152" fill="none" stroke="#17202a" stroke-width="2" stroke-linecap="round"/>
  <rect x="560" y="182" width="38" height="18" rx="3" fill="#e8eef4" stroke="#17202a"/>
  <text x="500" y="202" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#5b6673">connector 8 pins</text>
  <text x="500" y="232" font-family="Arial, sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#17202a">1 · Pantalla GC9A01 240×240</text>

  <!-- 2 heatsink -->
  <rect x="375" y="255" width="250" height="28" rx="6" fill="#d5d8dc" stroke="#17202a"/>
  <g stroke="#17202a" stroke-width="2">
    <line x1="400" y1="255" x2="400" y2="283"/><line x1="430" y1="255" x2="430" y2="283"/>
    <line x1="460" y1="255" x2="460" y2="283"/><line x1="490" y1="255" x2="490" y2="283"/>
    <line x1="520" y1="255" x2="520" y2="283"/><line x1="550" y1="255" x2="550" y2="283"/>
    <line x1="580" y1="255" x2="580" y2="283"/>
  </g>
  <text x="500" y="305" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" fill="#5b6673">2 · dissipador i separadors</text>

  <!-- 3 board -->
  <rect x="330" y="325" width="340" height="120" rx="12" fill="#eaf2f8" stroke="#17202a" stroke-width="2"/>
  <rect x="355" y="350" width="80" height="55" rx="5" fill="#aeb6bf" stroke="#17202a"/>
  <text x="395" y="383" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#17202a">SoC</text>
  <rect x="470" y="350" width="165" height="24" rx="4" fill="#d6eaf8" stroke="#17202a"/>
  <text x="552" y="367" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#17202a">header 2 × 20</text>
  <rect x="470" y="388" width="90" height="32" rx="4" fill="#d5f5e3" stroke="#17202a"/>
  <text x="515" y="409" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#17202a">USB</text>
  <text x="500" y="470" font-family="Arial, sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#17202a">3 · Orange Pi 5 Pro 8 GB</text>

  <!-- 4 microSD left -->
  <rect x="95" y="345" width="130" height="72" rx="8" fill="#ffffff" stroke="#17202a" stroke-width="2"/>
  <rect x="112" y="361" width="58" height="38" rx="3" fill="#f5b7b1" stroke="#17202a"/>
  <text x="141" y="385" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#17202a">microSD</text>
  <text x="160" y="438" font-family="Arial, sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#17202a">4 · targeta</text>
  <line x1="225" y1="381" x2="330" y2="381" stroke="#aab7c4" stroke-width="2" stroke-dasharray="5 5"/>

  <!-- 5 PSU right -->
  <rect x="760" y="345" width="140" height="72" rx="8" fill="#ffffff" stroke="#17202a" stroke-width="2"/>
  <rect x="780" y="365" width="40" height="32" rx="4" fill="#f9e79f" stroke="#17202a"/>
  <text x="800" y="386" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#17202a">5 V</text>
  <text x="858" y="382" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#17202a">3 A</text>
  <text x="830" y="438" font-family="Arial, sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#17202a">5 · font USB-C</text>
  <line x1="670" y1="381" x2="760" y2="381" stroke="#aab7c4" stroke-width="2" stroke-dasharray="5 5"/>

  <!-- 6 audio -->
  <rect x="80" y="500" width="180" height="74" rx="8" fill="#ffffff" stroke="#17202a" stroke-width="2"/>
  <circle cx="122" cy="537" r="18" fill="#d5d8dc" stroke="#17202a"/>
  <path d="M112 537 Q122 525 132 537 Q122 549 112 537" fill="none" stroke="#17202a" stroke-width="2"/>
  <rect x="165" y="522" width="52" height="20" rx="3" fill="#d6eaf8" stroke="#17202a"/>
  <text x="191" y="536" font-family="Arial, sans-serif" font-size="8" text-anchor="middle" fill="#17202a">USB</text>
  <text x="170" y="566" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#5b6673">micro + altaveu</text>
  <text x="170" y="594" font-family="Arial, sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#17202a">6 · àudio</text>

  <!-- 7 case -->
  <path d="M700 505 L900 505 L930 545 L930 585 L670 585 L670 545 Z" fill="#f4ecf7" stroke="#17202a" stroke-width="2"/>
  <path d="M700 505 L730 545 L930 545" fill="none" stroke="#17202a" stroke-width="2"/>
  <text x="800" y="566" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#5b6673">caixa parcial</text>
  <text x="800" y="610" font-family="Arial, sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#17202a">7 · caixa i protecció</text>

  <!-- callout rail -->
  <g font-family="Arial, sans-serif" font-size="12" fill="#5b6673">
    <text x="70" y="120">Peces del prototip</text>
    <text x="70" y="140">1 pantalla</text>
    <text x="70" y="160">2 dissipador</text>
    <text x="70" y="180">3 placa</text>
    <text x="70" y="200">4 microSD</text>
    <text x="70" y="220">5 alimentació</text>
    <text x="70" y="240">6 àudio</text>
    <text x="70" y="260">7 caixa</text>
  </g>

  <!-- Note -->
  <rect x="80" y="645" width="840" height="50" rx="10" fill="#fff4e5" stroke="#b9770e" stroke-width="2"/>
  <text x="500" y="667" font-family="Arial, sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#8a4b0f">Aquest esquema no és un plànol de fabricació: la caixa no té CAD final.</text>
  <text x="500" y="686" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#5b3a11">Cal validar ventilació, subjecció de la pantalla i pas de cables abans de tancar el conjunt.</text>
</svg>
